logLevel: warn
server:
  httpHostV4: "127.0.0.1"
  httpPortV4: 4000
# The gateway counts its own requests so the app can show which endpoints are
# carrying the load. The counters stay on this machine — they are served on
# loopback and nothing is sent anywhere.
metrics:
  enabled: true
  hostV4: "127.0.0.1"
  port: 4001
projects:
  - id: main
    networks:
      - architecture: evm
        evm:
          chainId: 369
    upstreams:
      - id: local-node
        type: evm
        endpoint: "http://127.0.0.1:8545"
        evm:
          chainId: 369
          blockAvailability:
            lower:
              latestBlockMinus: 128
      - id: pulsechain-http-1
        type: evm
        endpoint: "https://rpc.pulsechain.com"
        evm:
          chainId: 369
        tags:
          - tier:fallback
        routing:
          scoreMultipliers:
            - overall: 0.2
      - id: pulsechain-ws-2
        type: evm
        endpoint: "wss://ws.pulsechain.com"
        evm:
          chainId: 369
        tags:
          - tier:fallback
        routing:
          scoreMultipliers:
            - overall: 0.2
