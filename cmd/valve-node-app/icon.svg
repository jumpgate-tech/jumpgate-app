<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ee38a"/>
      <stop offset="1" stop-color="#12b268"/>
    </linearGradient>
  </defs>
  <!-- macOS-style rounded tile -->
  <rect x="112" y="112" width="800" height="800" rx="180" fill="url(#bg)"/>
  <!-- hub / route: a central node routing out to three others -->
  <g stroke="#ffffff" stroke-width="46" stroke-linecap="round" fill="none">
    <line x1="512" y1="512" x2="512" y2="300"/>
    <line x1="512" y1="512" x2="330" y2="700"/>
    <line x1="512" y1="512" x2="694" y2="700"/>
  </g>
  <g fill="#ffffff">
    <circle cx="512" cy="512" r="72"/>
    <circle cx="512" cy="300" r="52"/>
    <circle cx="330" cy="700" r="52"/>
    <circle cx="694" cy="700" r="52"/>
  </g>
</svg>
