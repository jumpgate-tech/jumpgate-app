# Builds every shippable artifact and, on a version tag, publishes them to a
# GitHub Release that the jumpgate.app landing page links to.
#
# Two flavors, per the product decision:
#   - headless binary  (CGO off, cross-compiled) for mac/win/linux — goreleaser
#   - desktop app       (CGO on, -tags tray, native runners) — the matrix below
#       macOS  -> Jumpgate.app (tray + menubar), ad-hoc signed, zipped
#       Windows-> jumpgate.exe (webview window; no tray icon yet, macOS-only)
#       Linux  -> jumpgate     (webview window; no tray icon yet)
#
# Triggers:
#   - push a tag v*      -> full build + attach to the Release
#   - workflow_dispatch  -> build everything and expose it as run artifacts
#                           (lets us exercise the workers without cutting a release)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- headless binaries (only when a tag is pushed) -----------------------
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: GoReleaser (creates the Release + headless binaries)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- desktop apps (always build; attach to Release on tags) --------------
  desktop:
    needs: [binaries]
    # run even on workflow_dispatch, where `binaries` is skipped
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-14
          - label: macos-amd64
            os: macos-15-intel # macos-13 (last Intel image) retired ~Dec 2025; macos-15-intel is the x86_64 label until ~Aug 2027
          - label: windows-amd64
            os: windows-latest
          - label: linux-amd64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # macOS: full Jumpgate.app (tray + menubar) via the packaging script
      - name: Build Jumpgate.app (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install librsvg >/dev/null
          bash cmd/valve-node-app/build-macos-app.sh dist
          cd dist && zip -qry "Jumpgate-${{ matrix.label }}.zip" Jumpgate.app

      # Linux: webview desktop binary (needs GTK + WebKitGTK for CGo webview)
      - name: Build desktop binary (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
          mkdir -p dist
          CGO_ENABLED=1 go build -tags tray -ldflags "-s -w" -o dist/jumpgate ./cmd/valve-node-app
          tar -C dist -czf "dist/jumpgate-${{ matrix.label }}.tar.gz" jumpgate

      # Windows: webview desktop exe (-H windowsgui hides the console window)
      - name: Build desktop exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -tags tray -ldflags "-s -w -H windowsgui" -o dist/jumpgate.exe ./cmd/valve-node-app
          cd dist && 7z a "jumpgate-${{ matrix.label }}.zip" jumpgate.exe >/dev/null

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: jumpgate-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz

  # ---- unified checksums covering headless binaries AND desktop apps -------
  # goreleaser only checksums the headless jumpgate_* binaries; the desktop
  # apps the landing page links to are attached afterward. This job merges
  # both sets into one checksums.txt so every download is verifiable.
  checksums:
    needs: [binaries, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jumpgate-*
          path: desktop
          merge-multiple: true
      - name: Build and publish a unified checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # goreleaser already published checksums.txt for the headless binaries
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -O goreleaser.txt
          # add the desktop apps (the files the landing buttons link to), bare filenames
          ( cd desktop && sha256sum * ) | sort -k2 > desktop.txt
          cat goreleaser.txt desktop.txt | sort -k2 -u > checksums.txt
          echo "=== unified checksums.txt ==="; cat checksums.txt
          gh release upload "$TAG" checksums.txt -R "$GITHUB_REPOSITORY" --clobber
