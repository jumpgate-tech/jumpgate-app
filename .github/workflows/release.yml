# Builds every shippable artifact and, on a version tag, publishes them to a
# GitHub Release that the jumpgate.app landing page links to.
#
# Two flavors, per the product decision:
#   - headless binaries (CGO off, cross-compiled, embedded agents) — goreleaser
#   - desktop bundles   (native runners, embedded agents) — the matrix below
#       macOS   -> Jumpgate-macos-<arch>.zip: Jumpgate.app (window + menubar)
#                  and Jumpgate Terminal.app (opens a terminal running jumpgate)
#       Windows -> jumpgate-windows-amd64.zip: jumpgate.exe (console) and
#                  jumpgate-tray.exe (window + notification icon)
#       Linux   -> jumpgate-linux-<arch>.tar.gz: window build on WebKitGTK
#                  4.1, .desktop entries for a terminal and a window, install.sh
#
# This repository is the public, auditable release mirror: development and CI
# live on the self-hosted GitLab. Tags are pushed here by the maintainer at
# release time.
#
# Triggers:
#   - push a tag v*      -> full build + attach to the Release
#   - workflow_dispatch  -> goreleaser snapshot (nothing published) and every
#                           desktop bundle as run artifacts
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- headless binaries (only when a tag is pushed) -----------------------
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          check-latest: true
      - name: GoReleaser (creates the Release + headless binaries)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- goreleaser dry run (manual runs only) -------------------------------
  # `binaries` is skipped on workflow_dispatch, so without this the goreleaser
  # config would never be exercised outside a real release.
  snapshot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          check-latest: true
      - name: GoReleaser snapshot (builds everything, publishes nothing)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean --skip=publish
      - name: List dist and check the raw agents are checksummed
        run: |
          set -euo pipefail
          ls -l dist
          cat dist/checksums.txt
          grep -q ' jumpgate-linux-amd64$' dist/checksums.txt
          grep -q ' jumpgate-linux-arm64$' dist/checksums.txt

  # ---- desktop apps (always build; attach to Release on tags) --------------
  desktop:
    needs: [binaries]
    # run even on workflow_dispatch, where `binaries` is skipped
    if: ${{ !cancelled() && (needs.binaries.result == 'success' || needs.binaries.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-14
          - label: macos-amd64
            os: macos-15-intel # macos-13 (last Intel image) retired ~Dec 2025; macos-15-intel is the x86_64 label until ~Aug 2027
          - label: windows-amd64
            os: windows-latest
          - label: linux-amd64
            os: ubuntu-24.04
          - label: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # The tag on a release; on a manual run, git describe inside the scripts.
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          check-latest: true

      - name: Build both apps (macOS)
        if: runner.os == 'macOS'
        run: |
          bash cmd/jumpgate/build-macos-app.sh dist
          cd dist && zip -qry "Jumpgate-${{ matrix.label }}.zip" Jumpgate.app "Jumpgate Terminal.app"

      - name: Build the desktop bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
          scripts/package-linux.sh dist

      - name: Build both exes (Windows)
        if: runner.os == 'Windows'
        run: scripts/package-windows.sh dist

      - name: Upload run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jumpgate-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # ---- attach desktop bundles (tags only; the only desktop step that writes) --
  attach:
    needs: [binaries, desktop]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.binaries.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: jumpgate-*
          path: desktop
          merge-multiple: true
      - name: Attach to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            desktop/*.zip
            desktop/*.tar.gz

  # ---- unified checksums covering headless binaries AND desktop apps -------
  # goreleaser only checksums the headless jumpgate_* binaries; the desktop
  # apps the landing page links to are attached afterward. This job merges
  # both sets into one checksums.txt so every download is verifiable.
  checksums:
    needs: [binaries, desktop, attach]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: jumpgate-*
          path: desktop
          merge-multiple: true
      - name: Build and publish a unified checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # goreleaser already published checksums.txt for the headless binaries
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -O goreleaser.txt
          # add the desktop apps (the files the landing buttons link to), bare filenames
          ( cd desktop && sha256sum * ) | sort -k2 > desktop.txt
          cat goreleaser.txt desktop.txt | sort -k2 -u > checksums.txt
          echo "=== unified checksums.txt ==="; cat checksums.txt
          gh release upload "$TAG" checksums.txt -R "$GITHUB_REPOSITORY" --clobber

  # ---- build provenance, after the unified checksums.txt is final ----------
  # Attests every published file (archives, bundles, raw agents and the merged
  # checksums.txt). Verify a download with:
  #   gh attestation verify <file> --repo jumpgate-tech/jumpgate-app
  provenance:
    needs: [checksums]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist
          ls -l dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

  # ---- the signed apt and dnf repository at pkg.jumpgate.app ---------------
  # Off until the maintainer sets the variable PKG_REPO_ENABLED=true; the
  # packages environment requires a maintainer's approval and holds the
  # signing key and the R2 token (scoped to the jumpgate-pkg bucket). The
  # key lives only in a tmpfs keyring that the last step removes.
  packages:
    needs: [provenance]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PKG_REPO_ENABLED == 'true'
    environment: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Whoever can edit the Release could swap a package; nothing is signed
      # until each one matches the attested checksums.txt and carries build
      # provenance from this workflow. Both checks run before the key exists.
      - name: Download and verify the packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir pkgs
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D pkgs -p '*.deb' -p '*.rpm' -p checksums.txt
          cd pkgs
          shopt -s nullglob
          files=(*.deb *.rpm)
          [ "${#files[@]}" -gt 0 ] || { echo "no packages in the release" >&2; exit 1; }
          gh attestation verify checksums.txt --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          for f in "${files[@]}"; do
            grep -E "^[0-9a-f]{64}  $f\$" checksums.txt > "$f.sha256" || { echo "$f is not in checksums.txt" >&2; exit 1; }
            sha256sum -c "$f.sha256"
            rm "$f.sha256"
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          rm checksums.txt
          ls -l
      - name: Install the repository tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y aptly createrepo-c rpm gnupg
      - name: Import the signing key
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
          PKG_SIGNING_PASSPHRASE: ${{ secrets.PKG_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          GNUPGHOME="$(mktemp -d /dev/shm/gnupg.XXXXXX)"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          gpg --batch --import <<<"$PKG_SIGNING_KEY"
          printf '%s\n' "$PKG_SIGNING_PASSPHRASE" > "$GNUPGHOME/passphrase"
          echo "PKG_SIGNING_PASSPHRASE_FILE=$GNUPGHOME/passphrase" >> "$GITHUB_ENV"
          fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "PKG_KEY_ID=$fpr" >> "$GITHUB_ENV"
      - name: Build the repository
        run: scripts/build-pkg-repo.sh --in pkgs --out repo --key-id "$PKG_KEY_ID"
      - name: Sync to R2, packages before the indexes that name them
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://4d950372162cef595726db63c21035ab.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          s3() { aws s3 --endpoint-url "$R2" "$@"; }
          s3 sync repo/apt/pool/ s3://jumpgate-pkg/apt/pool/
          s3 sync repo/rpm/ s3://jumpgate-pkg/rpm/ --exclude 'repodata/*'
          s3 sync repo/apt/dists/ s3://jumpgate-pkg/apt/dists/
          s3 sync repo/rpm/repodata/ s3://jumpgate-pkg/rpm/repodata/
          s3 cp repo/jumpgate.asc s3://jumpgate-pkg/jumpgate.asc
          s3 cp repo/jumpgate.repo s3://jumpgate-pkg/jumpgate.repo
      - name: Remove the signing keyring
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi
