name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/valve-node-app/web/package-lock.json

      - name: Build web UI
        run: |
          cd cmd/valve-node-app/web
          npm ci
          npm run build

      - name: Verify web/dist is committed and reproducible
        run: git diff --exit-code cmd/valve-node-app/web/dist

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build (headless)
        run: go build ./cmd/valve-node-app

      - name: cross-compile check (windows, darwin — headless)
        run: |
          GOOS=windows go build ./...
          GOOS=darwin go build ./...

  # The Rust billing service. It is a standalone crate under services/billing,
  # invisible to the Go tooling above, so it needs its own gate.
  billing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/billing
    steps:
      - uses: actions/checkout@v4

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked
