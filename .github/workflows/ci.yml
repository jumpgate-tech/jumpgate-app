name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an older run, so parallel feature
# branches do not starve each other of hosted runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The embedded web UI must be committed and reproducible. It is checked once,
  # on Linux; the Go jobs below use the committed dist.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/jumpgate/web/package-lock.json
      - name: Build web UI
        run: |
          cd cmd/jumpgate/web
          npm ci
          npm run build
      - name: Verify web/dist is committed and reproducible
        run: git diff --exit-code cmd/jumpgate/web/dist

  # The controller is supported on all three desktop OSes, so its tests run on
  # all three. bash on Windows is Git Bash, present on every hosted image.
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: go vet
        run: go vet ./...
      # Verbose on Windows, before the full run, so the log shows whether the
      # symlink tests ran or skipped (making a symlink needs a privilege) and
      # every DACL test that passed.
      - name: go test fsperm and key file (verbose)
        if: runner.os == 'Windows'
        run: |
          go test -v ./internal/fsperm/
          go test -v -run 'KeyFile|Symlink|OnePasswordTemplate' ./internal/signer/
      # The real Credential Manager of the runner's user. Only CI sets the
      # variable, so no developer's credentials are written; the grep fails
      # the job if the test skipped instead of running.
      - name: go test real Windows Credential Manager (verbose)
        if: runner.os == 'Windows'
        env:
          JUMPGATE_TEST_REAL_WINCRED: "1"
        run: |
          go test -count=1 -v -run '^TestRealWinCred$' ./internal/signer/ | tee "$RUNNER_TEMP/wincred.log"
          grep -q -- '--- PASS: TestRealWinCred ' "$RUNNER_TEMP/wincred.log"
      - name: go test
        run: go test ./...
      - name: go build (headless, no cgo)
        env:
          CGO_ENABLED: "0"
        run: go build -o "$RUNNER_TEMP/jumpgate-ci" ./cmd/jumpgate
      # The release builds the controller with cgo on these two, so the cgo
      # path (no tray tag) must keep compiling.
      - name: go build (headless, cgo)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go build -o "$RUNNER_TEMP/jumpgate-ci-cgo" ./cmd/jumpgate

  # Cheap guard for targets no runner tests natively, including the linux/arm64
  # build the agent ships as.
  cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: vet, compile tests and build for every target
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            echo "== $target"
            export GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
            go vet ./...
            go test -c -o "$(mktemp -d)/" ./...
            go build ./...
          done
      # Tag-gated test files that only the e2e and real-store scripts compile
      # would otherwise rot unnoticed between runs of those scripts.
      - name: vet the tag-gated tests
        run: |
          set -euo pipefail
          go vet -tags e2e ./internal/bootstrap/
          GOOS=linux go vet -tags realsecret ./internal/signer/
      - name: build the linux/arm64 controller and agent
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/jumpgate

  # The Linux key-store default and timeouts against a real secret-tool: no
  # D-Bus, D-Bus with no Secret Service, a hung tool, and gnome-keyring.
  secret-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux key store against a real Secret Service
        run: scripts/test-secret-service.sh

  # Pairing against real systemd containers: over SSH (e2e-agent) and this
  # machine itself through the CLI (e2e-local), on both supported distros.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        base: ["debian:12", "ubuntu:24.04"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: pair over SSH
        env:
          BASE: ${{ matrix.base }}
        run: scripts/e2e-agent.sh
      - name: pair this machine
        env:
          BASE: ${{ matrix.base }}
        run: scripts/e2e-local.sh

  windows-daemon:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: server lifecycle smoke
        shell: pwsh
        run: scripts/windows-smoke.ps1

  # The Rust billing service. It is a standalone crate under services/billing,
  # invisible to the Go tooling above, so it needs its own gate.
  billing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/billing
    steps:
      - uses: actions/checkout@v4

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  # Release builds embed both agents (spec D1). Build them the way the release
  # does and prove extraction and verification work on every controller OS.
  agents:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: build the embedded agents
        run: GZIP=1 scripts/build-agents.sh internal/agentbin/embedded
      - name: test the embedded build
        run: go test -tags embedagents ./internal/agentbin/
      - name: a release-style controller builds
        env:
          CGO_ENABLED: "0"
        run: go build -tags embedagents -o "$RUNNER_TEMP/jg" ./cmd/jumpgate

  windows-ssh-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: start the OpenSSH agent service
        shell: pwsh
        run: |
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent
      - name: dial through the named pipe
        shell: bash
        env:
          JUMPGATE_TEST_WIN_AGENT: "1"
        run: go test -count=1 -timeout 120s -run TestOpenSSHAgentPipe -v ./internal/executor/

  desktop-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: vet and test the tray build
        run: |
          go vet -tags tray ./cmd/jumpgate
          go test -tags tray ./cmd/jumpgate
      - name: build and check both apps
        run: scripts/test-macos-bundle.sh

  desktop-linux:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: build, install and open the Linux desktop bundle
        run: scripts/test-linux-desktop.sh
