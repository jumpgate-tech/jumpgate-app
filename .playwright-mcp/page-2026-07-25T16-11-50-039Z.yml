    - paragraph [ref=f2e179]: "It also restarts RPC gateway (eRPC), in front of it. That restart is required, not tidy-up: eRPC only ever moves a chain's head forward, so once this chain restarts at block 0 the gateway would keep advertising the old head — answering for blocks the chain no longer has — until the new chain grew past it."
