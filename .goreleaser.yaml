version: 2
project_name: jumpgate

before:
  hooks:
    - go mod tidy

builds:
  - id: jumpgate
    main: ./cmd/valve-node-app
    binary: jumpgate
    env:
      - CGO_ENABLED=0
    # Inject the release version so the running binary knows what it is and the
    # update check can compare against the latest release. {{.Version}} is the
    # git tag goreleaser is building.
    ldflags:
      - -s -w
      - -X github.com/valve-tech/valve-node-app/internal/buildinfo.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: jumpgate
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
