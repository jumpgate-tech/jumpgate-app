version: 2
project_name: jumpgate

before:
  hooks:
    - go mod tidy
    # Release controllers embed both static Linux agents (spec D1), built from
    # this commit with this tag as their version (D15).
    - env GZIP=1 VERSION={{ .Tag }} bash scripts/build-agents.sh internal/agentbin/embedded

builds:
  - id: jumpgate
    main: ./cmd/jumpgate
    binary: jumpgate
    env:
      - CGO_ENABLED=0
    tags:
      - embedagents
    # The tag (v-prefixed) is the version everywhere, so the controller and
    # the agents it embeds report the same string.
    ldflags:
      - -s -w
      - -X github.com/valve-tech/jumpgate/internal/buildinfo.version={{ .Tag }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: jumpgate
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

# The controller service as deb and rpm (D14): the binary, the unit and the
# sysusers entry. The postinst never enables the unit and never plainly
# restarts it (a restart comes back locked); the agent binary on a box is
# never the package's.
nfpms:
  - id: jumpgate
    package_name: jumpgate
    ids: [jumpgate]
    formats: [deb, rpm]
    bindir: /usr/bin
    homepage: https://jumpgate.app
    description: jumpgate controller and CLI
    license: see LICENSE
    # Placeholder until confirmed at review.
    maintainer: jumpgate-tech <https://github.com/jumpgate-tech/jumpgate-app>
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    contents:
      - {src: packaging/linux/server/jumpgate.service, dst: /usr/lib/systemd/system/jumpgate.service, file_info: {mode: 0644}}
      - {src: packaging/linux/server/jumpgate.sysusers, dst: /usr/lib/sysusers.d/jumpgate.conf, file_info: {mode: 0644}}
    scripts:
      postinstall: packaging/linux/server/postinst.sh

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  extra_files:
    - glob: ./internal/agentbin/embedded/jumpgate-linux-amd64
    - glob: ./internal/agentbin/embedded/jumpgate-linux-arm64
    - glob: ./packaging/install/install.sh

release:
  # The raw gates, for anyone who wants to verify or install one by hand, and
  # install.sh, so the checksums and provenance jobs cover it.
  extra_files:
    - glob: ./internal/agentbin/embedded/jumpgate-linux-amd64
    - glob: ./internal/agentbin/embedded/jumpgate-linux-arm64
    - glob: ./packaging/install/install.sh
    - glob: ./internal/agentbin/embedded/SHA256SUMS
      name_template: agents-SHA256SUMS

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
