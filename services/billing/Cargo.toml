[package]
name = "billing"
version = "0.1.0"
edition = "2021"
description = "Jumpgate metered API-key and billing service"
license = "MIT"
publish = false

[lib]
name = "billing"
path = "src/lib.rs"

[[bin]]
name = "billing"
path = "src/main.rs"

[dependencies]
# rusqlite links SQLite in-process. "bundled" compiles it from source, so the
# box needs no system SQLite and a musl static build stays self-contained.
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
# Key crypto: CSPRNG bytes, keyed HMAC hashing, and base58 formatting.
rand = "0.10"
hmac = "0.12"
sha2 = "0.10"
bs58 = "0.5"
# Admin HTTP API: axum on tokio, JSON via serde, constant-time token compare.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"

[dev-dependencies]
# Drive the router in tests with no real socket (ServiceExt::oneshot), and read
# the response body.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
# small, flat binary for the 512 MB VPS
opt-level = "z"
lto = true
strip = true
codegen-units = 1
