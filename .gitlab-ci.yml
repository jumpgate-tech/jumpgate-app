# CI for the self-hosted GitLab (git.craftsmanfounder.com). Mirrors the checks in
# .github/workflows/ci.yml, which now runs only on main and pull requests as the
# release audit. Shared docker runners only: no `tags:` except on the manual
# windows/macos jobs below, since a job with an unserved tag pends forever.
stages: [test]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger"'
    - when: never

default:
  timeout: 45m

variables:
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  CARGO_HOME: $CI_PROJECT_DIR/.cache/cargo
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  GOFLAGS: -buildvcs=false

web:
  stage: test
  image: node:22-bookworm
  cache:
    key:
      files: [cmd/jumpgate/web/package-lock.json]
    paths: [.cache/npm/]
  script:
    - cd cmd/jumpgate/web
    - npm ci
    - npm run build
    - cd "$CI_PROJECT_DIR"
    # The embedded web UI must be committed and reproducible.
    - git diff --exit-code cmd/jumpgate/web/dist

go-linux:
  stage: test
  image: golang:1.25-bookworm
  timeout: 60m
  cache:
    key:
      files: [go.sum]
    paths: [.cache/go-mod/, .cache/go-build/]
  before_script:
    # -race needs cgo; the golang image normally ships gcc, install if absent.
    - command -v gcc >/dev/null || (apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev)
    - export HOME="$(mktemp -d)" USERPROFILE="$HOME"
  script:
    - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
    - go vet ./...
    - go vet -tags e2e ./internal/bootstrap/
    - GOOS=linux go vet -tags realsecret ./internal/signer/
    - CGO_ENABLED=1 go test -race -p 2 ./...
    - CGO_ENABLED=0 go build -o /dev/null ./cmd/jumpgate

cross:
  stage: test
  image: golang:1.25-bookworm
  timeout: 60m
  cache:
    key:
      files: [go.sum]
    paths: [.cache/go-mod/, .cache/go-build/]
  script:
    - |
      set -euo pipefail
      for target in linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
        echo "== $target"
        export GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
        go vet ./...
        go test -c -o "$(mktemp -d)/" ./...
        go build ./...
      done
    - GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/jumpgate

# The Windows tray build (jumpgate-tray.exe) needs cgo for WebView2, which the
# CGO_ENABLED=0 cross job above cannot compile. trixie's mingw-w64 ships the
# WebView2 headers' dependencies; EventToken.h is spelled eventtoken.h there,
# which only matters on a case-sensitive file system, hence the one-line shim.
# Running the tray tests needs Windows: the local VM or the windows job.
windows-tray-cross:
  stage: test
  image: golang:1.25-trixie
  cache:
    key:
      files: [go.sum]
    paths: [.cache/go-mod/, .cache/go-build/]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends g++-mingw-w64-x86-64 >/dev/null
    - mkdir -p /opt/mingw-case && echo '#include <eventtoken.h>' > /opt/mingw-case/EventToken.h
  script:
    - |
      set -euo pipefail
      export GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ CGO_CXXFLAGS=-I/opt/mingw-case
      go vet -tags tray ./cmd/jumpgate
      go test -c -tags tray -o "$(mktemp -d)/" ./cmd/jumpgate
      go build -tags tray -ldflags "-H windowsgui" -o "$(mktemp -d)/jumpgate-tray.exe" ./cmd/jumpgate

billing:
  stage: test
  image: rust:1-bookworm
  cache:
    key:
      files: [services/billing/Cargo.lock]
    paths: [.cache/cargo/, services/billing/target/]
  before_script:
    - cd services/billing
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all --check
    - cargo clippy --all-targets --locked -- -D warnings
    - cargo test --locked

# No runner serves the windows or macos tags yet, so these are manual and
# never block. Until a runner is registered with tag `windows`, the local
# Windows VM (scripts/test-windows-vm.sh) is the Windows gate.
windows:
  stage: test
  tags: [windows]
  when: manual
  allow_failure: true
  script:
    - |
      $goVer = (Select-String -Path go.mod -Pattern '^go\s+(\S+)').Matches[0].Groups[1].Value
      $zip = "$env:TEMP\go.zip"
      Invoke-WebRequest "https://go.dev/dl/go$goVer.windows-amd64.zip" -OutFile $zip
      Expand-Archive $zip -DestinationPath C:\goroot -Force
      $env:PATH = "C:\goroot\go\bin;$env:PATH"
      $tmp = Join-Path $env:TEMP "jg-home"
      New-Item -ItemType Directory -Force $tmp | Out-Null
      $env:USERPROFILE = $tmp
      $env:HOME = $tmp
      go version
      go vet ./...
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      go test -p 2 ./...
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The real Credential Manager of the runner's user, only here (never on
      # a developer's machine); fail if the test skipped instead of running.
      $env:JUMPGATE_TEST_REAL_WINCRED = "1"
      $out = go test -count=1 -v -run '^TestRealWinCred$' ./internal/signer/ | Out-String
      $code = $LASTEXITCODE
      Remove-Item Env:JUMPGATE_TEST_REAL_WINCRED
      Write-Host $out
      if ($code -ne 0) { exit $code }
      if ($out -notmatch '--- PASS: TestRealWinCred ') { Write-Host "TestRealWinCred did not run"; exit 1 }

# The Linux key store against a real secret-tool (scripts/test-secret-service.sh
# runs in a Docker container on GitHub; here the job's image is that container).
secret-service:
  stage: test
  image: golang:1.25-bookworm
  cache:
    key:
      files: [go.sum]
    paths: [.cache/go-mod/, .cache/go-build/]
  script:
    - export HOME="$(mktemp -d)"
    - scripts/test-secret-service.sh --inside

# Needs a macOS runner tagged `macos`; none is registered yet.
macos:
  stage: test
  tags: [macos]
  when: manual
  allow_failure: true
  script:
    - export HOME="$(mktemp -d)"
    - go vet ./...
    - go test -p 2 ./...

# Pairs against systemd containers, which needs Docker with systemd and so
# cannot run on the shared docker runners. scripts/e2e-agent.sh is the local gate.
e2e:
  stage: test
  image: golang:1.25-bookworm
  when: manual
  allow_failure: true
  script:
    - scripts/e2e-agent.sh
    - scripts/e2e-local.sh
